[package]
name = "backend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
axum = "0.8.9"
axum-macros = "0.5.1"
axum-derive-error = "0.1.0"
backtrace = "0.3.76"
bcrypt = "0.19.3"
dotenvy = "0.15.7"
chrono = { version = "0.4.45", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["display"] }
futures = "0.3.34"
header = "0.0.0"
html-escape = "0.2.15"
http = "1.5.0"
http-serde = "2.1.1"
hyper = "1.11.0"
jsonwebtoken = "11.0.0"
mime = "0.3.17"
r2d2 = "0.8.10"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres"] }
termcolor = "1.4.1"
time = "0.3.55"
tokio = { version = "1.53", features = ["full"] }
thiserror = "2.0"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["serde", "v4"] }

shared = { path = "../shared" }
